[project]
name = "scope-wallspace-upscaler"
version = "0.1.0"
description = "Resolution-targeting upscaler (720p/1080p/2K/4K) with optional RIFE frame smoothing for WallSpace.Studio"
requires-python = ">=3.10"
dependencies = [
    "realesrgan",
    "basicsr",
]

[project.entry-points."scope"]
scope_wallspace_upscaler = "scope_wallspace_upscaler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope_wallspace_upscaler"]
